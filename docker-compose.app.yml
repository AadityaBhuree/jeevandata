# App services for the deploy workflow (docker-compose.yml holds infra only:
# postgres, redis, qdrant, minio, whisper, monitoring).
#
# Used by .github/workflows/deploy.yml on staging/production hosts:
#   docker compose -f docker-compose.app.yml pull
#   docker compose -f docker-compose.app.yml up -d
#
# Images are pushed to GHCR by the deploy workflow (IMAGE_BACKEND /
# IMAGE_FRONTEND, tagged with the commit SHA). Override the tag per deploy:
#   IMAGE_TAG=<sha> docker compose -f docker-compose.app.yml up -d

services:
  backend:
    image: ghcr.io/aadityabhuree/jeevandata/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - .env.docker # container-hostname env; .env is the localhost dev file
    environment:
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
      - qdrant
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/aadityabhuree/jeevandata/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - backend

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  qdrant:
    extends:
      file: docker-compose.yml
      service: qdrant

volumes:
  postgres-data:
  redis-data:
  qdrant-storage:
