version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── PostgreSQL (Primary Database) ───────────────────────────
  # pgvector/pgvector:pg16 ships the `vector` extension needed for
  # face-embedding vectors (stock postgres:16-alpine does not include it).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jeevandata-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    # PITR (Phase 7.4): archive every WAL segment (switch forced every 5 min so
    # there is always a recent archive point) into a subdir of the data volume.
    # The backup container mounts postgres-data read-only and ships these to
    # S3/R2. wal_level=replica is the PG16 default; set explicitly for clarity.
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_timeout=300
      -c "archive_command=mkdir -p /var/lib/postgresql/data/wal_archive && test ! -f /var/lib/postgresql/data/wal_archive/%f && cp %p /var/lib/postgresql/data/wal_archive/%f"
    environment:
      POSTGRES_USER: jeevandata
      POSTGRES_PASSWORD: jeevandata_secret
      POSTGRES_DB: jeevandata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker-init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeevandata -d jeevandata"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m

  # ─── Redis (Session State + BullMQ Queue) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: jeevandata-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # host 6380; backend .env REDIS_URL uses localhost:6380
    command: >
      redis-server
      --requirepass redis_secret
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 64m

  # ─── Qdrant (Vector Database for Face Embeddings) ────────────
  qdrant:
    image: qdrant/qdrant:v1.18.0  # matches backend @qdrant/js-client-rest ^1.13.0 (installed 1.18.0)
    container_name: jeevandata-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      # No QDRANT__SERVICE__API_KEY -> auth disabled (backend QDRANT_API_KEY is empty).
      # NB: an empty-string key enables auth in newer Qdrant, breaking the healthcheck.
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The qdrant image has bash but no curl/wget, so probe /healthz
      # over /dev/tcp instead of relying on external tools.
      # (CMD-SHELL uses /bin/sh, which has no /dev/tcp — invoke bash.)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 256m

  # ─── MinIO (Local S3-compatible / R2-equivalent Storage) ─────
  minio:
    image: minio/minio:latest
    container_name: jeevandata-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9002:9001"  # console moved to 9002; 9001 reserved for whisper
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION: auto
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m

  # ─── MinIO Bucket Initializer ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: jeevandata-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/jeevandata-media --ignore-existing &&
      mc mb local/jeevandata-backups --ignore-existing &&
      mc anonymous set download local/jeevandata-media &&
      mc policy set public local/jeevandata-media &&
      echo 'MinIO buckets initialized successfully'
      "
    logging: *default-logging

  # ─── Whisper Server (STT) ───────────────────────────────────
  # Source-built (docker/whisper.Dockerfile): the upstream image is compiled
  # with AVX-512 (-march=native on GH runners) and SIGILLs on CPUs without it.
  # GGML_NATIVE=OFF gives portable x86-64 with runtime CPU dispatch. Model
  # (ggml-small.bin, multilingual) is baked into the image at /models.
  whisper:
    build:
      context: .
      dockerfile: docker/whisper.Dockerfile
    image: jeevandata-whisper:local
    container_name: jeevandata-whisper
    restart: unless-stopped
    ports:
      - "9001:9001"
    # Runtime knobs — override via host env or a .env file next to this compose file.
    #   WHISPER_MODEL            path to the ggml model baked into the image (mount a
    #                            replacement model into /models to swap model sizes)
    #   WHISPER_LANGUAGE         spoken language; default 'auto' auto-detects (the baked
    #                            small model is multilingual: en, hi, mr, es, ...)
    #   WHISPER_NO_SPEECH_THOLD  0.0-1.0; lower = more willing to transcribe quiet or
    #                            noisy audio, higher = more likely to emit [Inaudible]
    #   WHISPER_THREADS          CPU threads used for inference
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-/models/ggml-small.bin}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      WHISPER_NO_SPEECH_THOLD: ${WHISPER_NO_SPEECH_THOLD:-0.6}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    command: ['sh', '-c', 'whisper-server --host 0.0.0.0 --port 9001 --model "$${WHISPER_MODEL:-/models/ggml-small.bin}" --no-gpu --threads "$${WHISPER_THREADS:-4}" --language "$${WHISPER_LANGUAGE:-auto}" --no-speech-thold "$${WHISPER_NO_SPEECH_THOLD:-0.6}" --convert']
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2g
        reservations:
          memory: 512m

  # ─── Redis Commander (Admin UI — dev only) ──────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: jeevandata-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_secret
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - devtools
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # ─── Prometheus (Metrics Scraper — Phase 7.6) ───────────────
  # Scrapes the backend's GET /metrics. The backend runs on the Docker
  # host in this stack, so we reach it via host.docker.internal:4000
  # (the extra_hosts host-gateway mapping makes that resolve on Linux).
  # If the backend is containerized later, point the target at its DNS
  # name instead (see monitoring/prometheus.yml).
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: jeevandata-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/rules/jeevandata-alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 128m

  # ─── Alertmanager (Alert Routing — Phase 7.6) ───────────────
  # Receives fired alerts from Prometheus and notifies Slack via webhook.
  # The placeholder webhook URL keeps the container bootable; replace
  # SLACK_WEBHOOK_URL in your environment/.env with a real incoming webhook
  # to enable Slack delivery. Alerts are always visible in the UI (:9093).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: jeevandata-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/REPLACE_ME}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=info"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # ─── Grafana (Dashboards — Phase 7.6) ───────────────────────
  # Datasource + dashboards are auto-provisioned from ./monitoring/grafana.
  # Default login: admin / ${GF_ADMIN_PASSWORD:-admin} — set GF_ADMIN_PASSWORD
  # in your environment (or .env) before deploying anywhere shared.
  grafana:
    image: grafana/grafana:11.1.0
    container_name: jeevandata-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 128m

  # ─── Backup & Disaster Recovery (Phase 7.4) ─────────────────
  # Scheduled full-stack backups (postgres dump + WAL, redis RDB, qdrant
  # snapshots) uploaded to MinIO/R2 (S3-compatible) with retention pruning.
  # Built from docker/backup.Dockerfile; backup output streams to
  # `docker logs jeevandata-backup`. Disable the immediate run with
  # BACKUP_RUN_ON_START=false; schedules via BACKUP_SCHEDULE / BACKUP_BASE_SCHEDULE.
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: jeevandata-backup:local
    container_name: jeevandata-backup
    restart: unless-stopped
    environment:
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_BASE_SCHEDULE: ${BACKUP_BASE_SCHEDULE:-0 3 * * 0}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: jeevandata-backups
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: jeevandata
      PG_PASSWORD: jeevandata_secret
      PG_DB: jeevandata
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redis_secret
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTIONS: face_embeddings
      PG_WAL_DIR: /var/lib/postgresql/data/wal_archive
      STAGE_DIR: /staging
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - backup-staging:/staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          memory: 128m

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qdrant-storage:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  backup-staging:
    driver: local
