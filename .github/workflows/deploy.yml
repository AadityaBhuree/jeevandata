name: Deploy

# Deploys the built images to a staging environment, runs smoke tests, then
# promotes to production behind a manual approval gate.
#
# REQUIRED SETUP (one-time):
#   1. GitHub Settings -> Environments -> create `staging` and `production`.
#      Add a required reviewer to `production` to gate the promote step.
#   2. Repository secrets (Settings -> Secrets and variables -> Actions):
#      - STAGING_HOST / STAGING_USER / STAGING_SSH_KEY  (optional; the local
#        container smoke test runs without them)
#      - PRODUCTION_HOST / PRODUCTION_USER / PRODUCTION_SSH_KEY
#      - APP_ENV_B64: base64 of the production .env file (e.g. on Windows:
#        certutil -encode .env prod.env.b64) for the remote deploy step
#   3. The remote server must run the stack via docker compose with the
#      compose file in this repo.
#
# The build/push and container smoke-test steps run in CI with no external
# infrastructure; only the staging/production SSH steps need real hosts.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend
  NEXT_PUBLIC_API_URL: https://api.jeevandata.example.com
  NEXT_PUBLIC_WS_URL: wss://api.jeevandata.example.com

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke test images
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeevandata_smoke
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: smoke-test-only-secret
    steps:
      - name: Pull backend image
        run: docker pull ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Run backend container
        run: |
          docker run -d --name smoke-backend -p 4000:4000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e NODE_ENV=test \
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:4000/health/live || true)
            if [ "$code" = "200" ]; then echo "HEALTHY after ~$((i*2))s"; exit 0; fi
            sleep 2
          done
          echo "Backend did not become healthy"; docker logs smoke-backend 2>&1 | tail -30; exit 1

      - name: Verify readiness response
        run: |
          curl -sf --max-time 10 http://localhost:4000/health/live | head -c 200; echo

      - name: Clean up
        if: always()
        run: docker rm -f smoke-backend || true

  deploy-staging:
    name: Deploy to staging
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ secrets.STAGING_HOST != '' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ vars.STAGING_DIR || '~/jeevandata' }}
            git pull --ff-only
            docker compose -f docker-compose.app.yml pull backend frontend
            docker compose -f docker-compose.app.yml up -d backend frontend
            docker image prune -f

  promote-production:
    name: Promote to production
    needs: [smoke-test, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ secrets.PRODUCTION_HOST != '' }}
    environment:
      name: production
      url: https://jeevandata.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH with env
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd ${{ vars.PRODUCTION_DIR || '~/jeevandata' }}
            git pull --ff-only
            echo "${{ secrets.APP_ENV_B64 }}" | base64 -d > .env
            docker compose -f docker-compose.app.yml pull backend frontend
            docker compose -f docker-compose.app.yml up -d backend frontend
            docker image prune -f
