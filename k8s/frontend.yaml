apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeevandata-frontend
  namespace: jeevandata
  labels:
    app: jeevandata
    tier: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: jeevandata
      tier: frontend
  template:
    metadata:
      labels:
        app: jeevandata
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: frontend
          image: ghcr.io/aadityabhuree/jeevandata/frontend:latest
          imagePullPolicy: Always # :latest is re-pushed on every deploy
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.jeevandata.example.com
            - name: NEXT_PUBLIC_WS_URL
              value: wss://api.jeevandata.example.com
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
