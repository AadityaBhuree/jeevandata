apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jeevandata-backend-hpa
  namespace: jeevandata
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jeevandata-backend
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jeevandata-frontend-hpa
  namespace: jeevandata
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jeevandata-frontend
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
