apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeevandata-backend
  namespace: jeevandata
  labels:
    app: jeevandata
    tier: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: jeevandata
      tier: backend
  template:
    metadata:
      labels:
        app: jeevandata
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: ghcr.io/aadityabhuree/jeevandata/backend:latest
          imagePullPolicy: Always # :latest is re-pushed on every deploy
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: jeevandata-config
            - secretRef:
                name: jeevandata-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
