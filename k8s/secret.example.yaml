#   kubectl create secret generic jeevandata-secrets --namespace jeevandata \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=GOOGLE_GEMINI_API_KEY='...' \
#     --from-literal=QDRANT_URL='http://qdrant:6333' \
#     --from-literal=MINIO_ROOT_USER='...' \
#     --from-literal=MINIO_ROOT_PASSWORD='...' \
#     --from-literal=PMS_API_KEY='...' \
#     --from-literal=SLACK_WEBHOOK_URL='...'
# NOTE: the backend Deployment references this Secret via envFrom — the pod
# will NOT start if the Secret is missing. Create it before the first rollout.
apiVersion: v1
kind: Secret
metadata:
  name: jeevandata-secrets
  namespace: jeevandata
type: Opaque
stringData:
  # Replace with real values (base64 is NOT required with stringData).
  DATABASE_URL: postgresql://user:password@postgres:5432/jeevandata
  REDIS_URL: redis://:password@redis:6379
  JWT_SECRET: change-me
  GOOGLE_GEMINI_API_KEY: change-me
  QDRANT_URL: http://qdrant:6333
